sylius_twig_hooks:
    hooks:
        'sylius_shop.base#javascripts':
            scripts:
                template: '@BitBagSyliusInPostPlugin/twig_hooks/shop/shared/layout/base/scripts.html.twig'
                priority: 0

        'sylius_admin.base#stylesheets':
            styles:
                template: '@BitBagSyliusInPostPlugin/twig_hooks/admin/shared/layout/base/stylesheets.html.twig'
                priority: 0

        sylius_admin.order.show.content.sections.customer:
            shipping_address:
                template: '@BitBagSyliusInPostPlugin/twig_hooks/admin/order/show/content/sections/customer/shipping_address.html.twig'
                priority: 200

        sylius_shop.checkout.select_shipping.content.form.shipments.shipment.choice.details:
            description:
                template: '@BitBagSyliusInPostPlugin/twig_hooks/shop/checkout/select_shipping/content/form/shipments/shipment/choice/details/description.html.twig'
                priority: 0

        'sylius_admin.shipping_method.create.content.form#left':
            image:
                template: '@BitBagSyliusInPostPlugin/twig_hooks/admin/shipping_method/form/image.html.twig'
                priority: -100

        'sylius_admin.shipping_method.update.content.form#left':
            image:
                template: '@BitBagSyliusInPostPlugin/twig_hooks/admin/shipping_method/form/image.html.twig'
                priority: -100

        # Pass the submitted form to the checkout components, so InPost validation errors
        # (phone number on the shipping step, cash on delivery on the payment step) are displayed.
        'sylius_shop.checkout.select_shipping.content':
            form:
                component: 'sylius_shop:checkout:shipping:form'
                props:
                    order: '@=_context.order'
                    form: '@=_context.form'
                    template: '@SyliusShop/checkout/select_shipping/content/form.html.twig'
                priority: 0

        'sylius_shop.checkout.select_payment.content':
            form:
                component: 'sylius_shop:checkout:payment:form'
                props:
                    resource: '@=_context.order'
                    form: '@=_context.form'
                    template: '@SyliusShop/checkout/select_payment/content/form.html.twig'
                priority: 0
